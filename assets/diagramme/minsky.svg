<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" width="640" height="310" role="img" font-family="system-ui, 'Segoe UI', Roboto, Arial, sans-serif" font-size="13" fill="#2a241c">
  <title>Minskys drei Finanzierungsformen: abgesichert, spekulativ, Ponzi</title>
  <!-- Kästen -->
  <g fill="#8a5a00" fill-opacity=".1" stroke="#8a5a00" stroke-width="1.5">
    <rect x="14" y="16" width="196" height="212" rx="8"/>
    <rect x="222" y="16" width="196" height="212" rx="8"/>
    <rect x="430" y="16" width="196" height="212" rx="8"/>
  </g>
  <g font-size="16" font-weight="700" text-anchor="middle">
    <text x="112" y="42">Abgesichert</text>
    <text x="320" y="42">Spekulativ</text>
    <text x="528" y="42">Ponzi</text>
  </g>
  <!-- Legende je Kasten: Einnahmen und fällige Zahlungen -->
  <g>
    <text x="28" y="68">Einnahmen</text>
    <rect x="28" y="74" width="160" height="14" fill="#2a241c"/>
    <text x="28" y="108">fällig: Zinsen + Tilgung</text>
    <rect x="28" y="114" width="60" height="14" fill="#8a5a00"/>
    <rect x="88" y="114" width="90" height="14" fill="#8a5a00" fill-opacity=".45"/>
  </g>
  <g>
    <text x="236" y="68">Einnahmen</text>
    <rect x="236" y="74" width="60" height="14" fill="#2a241c"/>
    <text x="236" y="108">fällig: Zinsen + Tilgung</text>
    <rect x="236" y="114" width="60" height="14" fill="#8a5a00"/>
    <rect x="296" y="114" width="90" height="14" fill="#8a5a00" fill-opacity=".45"/>
  </g>
  <g>
    <text x="444" y="68">Einnahmen</text>
    <rect x="444" y="74" width="34" height="14" fill="#2a241c"/>
    <text x="444" y="108">fällig: Zinsen + Tilgung</text>
    <rect x="444" y="114" width="60" height="14" fill="#8a5a00"/>
    <rect x="504" y="114" width="90" height="14" fill="#8a5a00" fill-opacity=".45"/>
  </g>
  <!-- Erklärungen -->
  <g text-anchor="middle">
    <text x="112" y="158">Die Einnahmen decken</text>
    <text x="112" y="175">Zinsen und Tilgung.</text>
    <text x="112" y="203" fill="#5b5142">Kredit wird planmäßig getilgt.</text>
    <text x="320" y="158">Die Einnahmen decken</text>
    <text x="320" y="175">nur die Zinsen.</text>
    <text x="320" y="203" fill="#5b5142">Tilgung braucht neuen Kredit.</text>
    <text x="528" y="158">Die Einnahmen decken</text>
    <text x="528" y="175">nicht einmal die Zinsen.</text>
    <text x="528" y="203" fill="#5b5142">Es hilft nur steigender Preis.</text>
  </g>
  <!-- Verschiebung -->
  <path d="M40 258H588" fill="none" stroke="#8a5a00" stroke-width="3"/>
  <path d="M604 258l-18-8v16z" fill="#8a5a00"/>
  <text x="320" y="288" text-anchor="middle" font-size="14" font-weight="600">In ruhigen Zeiten verschiebt sich das Gewicht nach rechts: Die Anfälligkeit wächst</text>
</svg>
