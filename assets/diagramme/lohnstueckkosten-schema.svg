<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" width="640" height="380" role="img" font-family="system-ui, 'Segoe UI', Roboto, Arial, sans-serif" font-size="14" fill="#2a241c">
  <title>Lohnstückkosten in einer Währungsunion: Abweichung von der Ziellinie (schematisch)</title>
  <text x="70" y="24" font-size="13" fill="#5b5142">Schematische Darstellung, keine Messwerte</text>
  <!-- Lücke -->
  <path d="M90 300L500 110V230Z" fill="#8a5a00" fill-opacity=".12"/>
  <!-- Achsen -->
  <path d="M70 50V320H600" fill="none" stroke="#2a241c" stroke-width="1.5"/>
  <path d="M70 44l-5 10h10zM606 320l-10-5v10z"/>
  <text x="78" y="50">Lohnstückkosten</text>
  <text x="90" y="342" font-size="13">Beginn der Währungsunion</text>
  <text x="500" y="342" font-size="13" text-anchor="middle">nach zehn Jahren</text>
  <!-- Linien -->
  <path d="M90 300L500 170" fill="none" stroke="#2a241c" stroke-width="2.5" stroke-dasharray="9 6"/>
  <path d="M90 300L500 110" fill="none" stroke="#8a5a00" stroke-width="3" stroke-linecap="round"/>
  <path d="M90 300L500 230" fill="none" stroke="#8a5a00" stroke-width="3" stroke-linecap="round" stroke-opacity=".55"/>
  <circle cx="90" cy="300" r="5"/>
  <text x="512" y="106" fill="#8a5a00" font-weight="600">Land über</text>
  <text x="512" y="123" fill="#8a5a00" font-weight="600">der Linie</text>
  <text x="512" y="166">Ziellinie</text>
  <text x="512" y="183" font-size="13" fill="#5b5142">(2 % pro Jahr)</text>
  <text x="512" y="228" fill="#8a5a00" font-weight="600">Land unter</text>
  <text x="512" y="245" fill="#8a5a00" font-weight="600">der Linie</text>
  <!-- Klammer -->
  <path d="M452 136V246" fill="none" stroke="#2a241c" stroke-width="1.5"/>
  <path d="M452 128l-4 9h8zM452 254l-4-9h8z"/>
  <text x="442" y="278" text-anchor="end" font-size="13">Lücke in der</text>
  <text x="442" y="294" text-anchor="end" font-size="13">Wettbewerbsfähigkeit</text>
  <path d="M446 272L452 250" fill="none" stroke="#2a241c" stroke-width="1"/>
</svg>
